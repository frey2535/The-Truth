name: Build Android App Bundle

on:
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: "Upload the signed AAB to Google Play after build"
        required: true
        default: false
        type: boolean
      play_track:
        description: "Google Play track to upload to"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: read

jobs:
  build-aab:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Read package version
        id: package-version
        run: |
          package_version=$(node -p "require('./package.json').version")
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Verify signing secrets
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error ::Missing GitHub secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-signing"
          if ! printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/android-signing/thetruth-upload.keystore"; then
            echo "::error ::ANDROID_UPLOAD_KEYSTORE_BASE64 is not valid base64."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/android-signing/thetruth-upload.keystore" ]; then
            echo "::error ::Decoded upload keystore is empty."
            exit 1
          fi

      - name: Build signed release bundle
        env:
          ANDROID_UPLOAD_STORE_FILE: ${{ runner.temp }}/android-signing/thetruth-upload.keystore
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: npm run android:bundle:release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheTruth-${{ steps.package-version.outputs.version }}-aab
          path: |
            release/TheTruth-${{ steps.package-version.outputs.version }}.aab
            release/TheTruth-${{ steps.package-version.outputs.version }}.aab.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Verify Google Play upload secret
        if: ${{ inputs.upload_to_play }}
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error ::Missing GitHub secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            exit 1
          fi

      - name: Upload AAB to Google Play
        if: ${{ inputs.upload_to_play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.currentflowconsulting.thetruth
          releaseFiles: release/TheTruth-${{ steps.package-version.outputs.version }}.aab
          tracks: ${{ inputs.play_track }}
          status: draft
