name: Play App Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Build release AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Decode upload keystore
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          if [ -z "$PLAY_KEYSTORE_BASE64" ]; then
            echo "No PLAY_KEYSTORE_BASE64 secret. Building an unsigned bundle."
            exit 0
          fi
          printf '%s' "$PLAY_KEYSTORE_BASE64" | base64 -d > android/upload.keystore
          {
            echo "storeFile=upload.keystore"
            echo "storePassword=$PLAY_KEYSTORE_PASSWORD"
            echo "keyAlias=${PLAY_KEY_ALIAS:-thetruth}"
            echo "keyPassword=${PLAY_KEY_PASSWORD:-$PLAY_KEYSTORE_PASSWORD}"
          } > android/keystore.properties
      - name: Assemble release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: thetruth-play-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
