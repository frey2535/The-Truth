plugins {
    id "com.android.application"
}

def keystoreProperties = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProperties.load(it) }
}

def envStoreFile = System.getenv("PLAY_KEYSTORE_FILE")
def envStorePassword = System.getenv("PLAY_KEYSTORE_PASSWORD")
def envKeyAlias = System.getenv("PLAY_KEY_ALIAS")
def envKeyPassword = System.getenv("PLAY_KEY_PASSWORD")
def hasEnvSigning = envStoreFile && file(envStoreFile).exists() && envStorePassword && envKeyAlias
def hasFileSigning = keystoreFile.exists() && keystoreProperties["storeFile"]

android {
    namespace "org.currentflowconsulting.thetruth"
    compileSdk 36

    defaultConfig {
        applicationId "org.currentflowconsulting.thetruth"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        resValue "string", "appName", "The Truth"
    }

    signingConfigs {
        if (hasEnvSigning || hasFileSigning) {
            release {
                if (hasEnvSigning) {
                    storeFile file(envStoreFile)
                    storePassword envStorePassword
                    keyAlias envKeyAlias
                    keyPassword envKeyPassword ?: envStorePassword
                } else {
                    storeFile rootProject.file(keystoreProperties["storeFile"] ?: "upload.keystore")
                    storePassword keystoreProperties["storePassword"]
                    keyAlias keystoreProperties["keyAlias"]
                    keyPassword keystoreProperties["keyPassword"]
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasEnvSigning || hasFileSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.6.2"
    implementation "androidx.appcompat:appcompat:1.7.0"
}
